<!DOCTYPE html>
<html lang="en" style="background-color: burlywood;">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox - 1 Dimensional Layout</title>

  <!-- Styling -->
  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <main>
    <section>
      <div class="container">
        <div class="flex">
          <div class="child odd" id="one">One</div>
          <div class="child even" id="two">Two</div>
          <div class="child odd" id="three">Three</div>
          <div class="child even" id="four">Four</div>
          <div class="child odd" id="five">Five</div>
          <div class="child even" id="six">Six</div>
        </div>
      </div>
    </section>
  </main>
</body>

</html>
